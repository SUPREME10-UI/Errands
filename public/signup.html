<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Run My Errand</title>
  <meta name="description" content="Sign up for premium errand services.">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg-alt);
    }
    .auth-card {
      background: var(--bg-card);
      padding: 3rem;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .auth-header h1 {
      font-size: 1.8rem;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }
    .auth-header p {
      color: var(--text-muted);
    }
    .auth-form .form-group {
      margin-bottom: 1.25rem;
    }
    .auth-form .btn-primary {
      width: 100%;
      margin-top: 1rem;
      padding: 1rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .error-msg {
      color: var(--danger, #ef4444);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/">
          <img src="/logo.jpg" alt="RME Logo">
        </a>
        <h1>Create an Account</h1>
        <p>Join Run My Errand for premium logistics</p>
      </div>

      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input class="form-input" type="text" id="signup-name" required placeholder="Abena Osei">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input class="form-input" type="email" id="signup-email" required placeholder="abena@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-phone">Phone Number</label>
          <input class="form-input" type="tel" id="signup-phone" required placeholder="+233 24 000 0000">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-address">Home/Office Address</label>
          <input class="form-input" type="text" id="signup-address" required placeholder="Plot 12, East Legon, Accra">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input class="form-input" type="password" id="signup-password" required placeholder="••••••••">
        </div>
        
        <p id="signup-error" class="error-msg"></p>

        <button type="submit" class="btn btn-primary" id="signup-btn">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Log In</a>
      </div>
    </div>
  </div>

  <!-- Load env vars from server before Firebase initializes -->
  <script src="/js/env-config.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
