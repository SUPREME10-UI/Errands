<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicon / Address Bar Icon -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Run My Errand</title>
  <meta name="description" content="Sign up for premium errand services.">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--header-height, 80px) + 0.25rem) 1rem 1.5rem;
      box-sizing: border-box;
    }
    .auth-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-image: url('/images/auth-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(8px) brightness(0.88);
      z-index: 0;
      pointer-events: none;
    }
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1;
      pointer-events: none;
    }
    .auth-card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0.75rem 1.35rem 0.85rem;
      border-radius: 16px;
      width: 100%;
      max-width: 385px;
      margin-top: -1.75rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border-color, #cbd5e1);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .auth-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
      margin-bottom: 0.05rem;
    }
    .auth-header img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      margin-top: -0.25rem;
      margin-bottom: 0.2rem;
      transition: transform 0.2s ease;
    }
    .auth-header img:hover {
      transform: scale(1.05);
    }
    .auth-header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary, #0052ff);
      margin: 0;
      line-height: 1.15;
    }
    .auth-header p {
      font-size: 0.74rem;
      color: var(--text-muted, #64748b);
      margin: 0;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 0.24rem;
    }
    .auth-form .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
      margin-bottom: 0;
    }
    .form-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-main, #1e293b);
      line-height: 1.1;
    }
    .form-input {
      width: 100%;
      padding: 0.32rem 0.62rem;
      border: 1.5px solid var(--border-color, #cbd5e1);
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.8rem;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--secondary, #0052ff);
      box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.18);
    }
    .auth-form .btn-primary {
      width: 100%;
      margin-top: 0.15rem;
      padding: 0.48rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
      background: var(--secondary, #0052ff);
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .auth-form .btn-primary:hover {
      background: var(--primary, #003bb5);
      transform: translateY(-1px);
    }
    .auth-footer {
      text-align: center;
      margin-top: 0.1rem;
      color: var(--text-muted, #64748b);
      font-size: 0.75rem;
    }
    .auth-footer a {
      color: var(--primary, #0052ff);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: var(--danger, #ef4444);
      font-size: 0.8rem;
      margin: 0;
      padding: 0.45rem 0.75rem;
      background: rgba(239, 68, 68, 0.12);
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-backdrop"></div>
    <div class="auth-overlay"></div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="/">
          <img src="/logo.png" alt="RME Logo">
        </a>
        <h1>Create Account</h1>
        <p>Join Run My Errand for premium logistics</p>
      </div>

      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input class="form-input" type="text" id="signup-name" required placeholder="Abena Osei">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input class="form-input" type="email" id="signup-email" required placeholder="abena@example.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-phone">Phone Number</label>
          <input class="form-input" type="tel" id="signup-phone" required placeholder="+233 24 000 0000">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-address">Home / Office Address</label>
          <input class="form-input" type="text" id="signup-address" required placeholder="Plot 12, East Legon, Accra">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input class="form-input" type="password" id="signup-password" required placeholder="••••••••">
        </div>
        
        <p id="signup-error" class="error-msg"></p>

        <button type="submit" class="btn btn-primary" id="signup-btn">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Log In</a>
      </div>
    </div>
  </div>

  <!-- Load env vars from server before Firebase initializes -->
  <script src="/js/env-config.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
