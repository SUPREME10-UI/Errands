<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicon / Address Bar Icon -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Run My Errand</title>
  <meta name="description" content="Log in to your premium errand services dashboard.">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
      box-sizing: border-box;
      background: #0f172a;
    }
    .auth-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url('/images/auth-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(8px) brightness(0.85);
      transform: scale(1.04);
      z-index: 0;
      pointer-events: none;
    }
    .auth-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      z-index: 1;
      pointer-events: none;
    }
    .auth-card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1.5rem 1.75rem;
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-sizing: border-box;
    }
    .auth-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      margin-bottom: 0.25rem;
    }
    .auth-header img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      margin-top: -0.45rem;
      margin-bottom: 0.35rem;
      transition: transform 0.2s ease;
    }
    .auth-header img:hover {
      transform: scale(1.05);
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary, #0052ff);
      margin: 0;
      line-height: 1.2;
    }
    .auth-header p {
      font-size: 0.82rem;
      color: var(--text-muted, #64748b);
      margin: 0;
    }
    .auth-form .form-group {
      margin-bottom: 1.25rem;
    }
    .auth-form .btn-primary {
      width: 100%;
      margin-top: 1rem;
      padding: 1rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .error-msg {
      color: var(--danger, #ef4444);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-backdrop"></div>
    <div class="auth-overlay"></div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="/">
          <img src="/logo.png" alt="RME Logo">
        </a>
        <h1>Welcome Back</h1>
        <p>Log in to your dashboard</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-input" type="email" id="login-email" required placeholder="abena@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" type="password" id="login-password" required placeholder="••••••••">
        </div>
        
        <p id="login-error" class="error-msg"></p>

        <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <!-- Load env vars from server before Firebase initializes -->
  <script src="/js/env-config.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
