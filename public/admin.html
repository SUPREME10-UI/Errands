<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Run My Errand</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Premium Header -->
  <header class="header">
    <div class="container header-container">
      <a href="/admin.html" class="logo">
        <img class="logo-image" src="/logo.jpg" alt="RME Logo">
        <div class="logo-text">
          <span>RME ADMIN CMS</span>
          <span>Logistics Command Center</span>
        </div>
      </a>
      
      <div class="nav-actions">
        <button id="logout-btn" class="btn btn-secondary btn-sm">Log Out</button>
      </div>
    </div>
  </header>

  <div class="admin-container" style="padding-top: 100px;">
    <main class="admin-main">
      <div class="admin-header">
        <h1>All Errands</h1>
        <p>Manage and dispatch user orders in real-time.</p>
      </div>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Client</th>
              <th>Category</th>
              <th>Urgency</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-orders-list">
            <!-- Orders injected via JS -->
            <tr>
              <td colspan="7" style="text-align: center; padding: 2rem;">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Status Update Modal -->
  <div id="status-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Update Order Status</h2>
      <p id="modal-order-id" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
      
      <div class="form-group">
        <label class="form-label">Status</label>
        <select id="modal-status-select" class="form-select">
          <option value="Pending Assignment">Pending Assignment</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      
      <div class="form-group" style="margin-top: 1rem;">
        <label class="form-label">Assign Rider (Optional)</label>
        <input type="text" id="modal-rider-input" class="form-input" placeholder="e.g. Kwame Mensah">
      </div>
      
      <button id="modal-save-btn" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Save Changes</button>
    </div>
  </div>

  <!-- Load env vars from server before Firebase initializes -->
  <script src="/js/env-config.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
